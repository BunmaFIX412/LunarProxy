name: Build LunarProxy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ==========================================
      # 4. Go
      # ==========================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"


      # ==========================================
      # 5. Extract ZIP
      # ==========================================
      - name: Extract LunarProxy
        run: |
          mkdir -p source
          unzip -o LunarProxy-main.zip -d source

          echo "===== PROJECT ====="
          find source/LunarProxy-main -maxdepth 3 -type f | sort | head -200


      # ==========================================
      # 6. Prepare Expo SDK 54
      # ==========================================
      - name: Prepare Expo SDK 54
        working-directory: source/LunarProxy-main/app
        run: |
          npm pkg set dependencies.expo="~54.0.0"
          npm pkg set dependencies.react="19.1.0"
          npm pkg set dependencies.react-native="0.81.5"

          npm pkg delete dependencies.expo-modules-core

          npm pkg delete dependencies.expo-build-properties
          npm pkg delete dependencies.expo-font
          npm pkg delete dependencies.expo-localization
          npm pkg delete dependencies.expo-notifications
          npm pkg delete dependencies.expo-secure-store
          npm pkg delete dependencies.expo-splash-screen
          npm pkg delete dependencies.expo-tracking-transparency
          npm pkg delete dependencies.expo-web-browser

          echo "===== PACKAGE.JSON ====="
          cat package.json


      # ==========================================
      # 7. Disable Firebase Google Services
      # ==========================================
      - name: Disable Firebase Google Services
        working-directory: source/LunarProxy-main/app
        run: |
          if [ -f app.json ]; then
            cp app.json app.json.backup

            python3 -c '
          import json

          path = "app.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          expo = data.get("expo", {})

          android = expo.get("android", {})

          if isinstance(android, dict):
              android.pop("googleServicesFile", None)
              expo["android"] = android

          plugins = expo.get("plugins", [])

          if isinstance(plugins, list):
              new_plugins = []

              for plugin in plugins:
                  if isinstance(plugin, list):
                      name = plugin[0] if plugin else ""
                  else:
                      name = plugin

                  if name in [
                      "@react-native-firebase/app",
                      "@react-native-firebase/crashlytics"
                  ]:
                      print("Removing Firebase plugin:", name)
                      continue

                  new_plugins.append(plugin)

              expo["plugins"] = new_plugins

          data["expo"] = expo

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          print("Firebase configuration disabled for this build.")
          '

            echo "===== UPDATED APP.JSON ====="
            cat app.json
          else
            echo "app.json not found"
          fi


      # ==========================================
      # 8. Install dependencies
      # ==========================================
      - name: Install dependencies
        working-directory: source/LunarProxy-main/app
        run: |
          npm install --legacy-peer-deps


      # ==========================================
      # 9. Install Expo packages
      # ==========================================
      - name: Install Expo packages
        working-directory: source/LunarProxy-main/app
        run: |
          npx expo install \
            expo-build-properties \
            expo-font \
            expo-localization \
            expo-notifications \
            expo-secure-store \
            expo-splash-screen \
            expo-tracking-transparency \
            expo-web-browser \
            react-native-worklets


      # ==========================================
      # 10. Fix Expo dependencies
      # ==========================================
      - name: Fix Expo dependencies
        working-directory: source/LunarProxy-main/app
        run: |
          npx expo install --fix


      # ==========================================
      # 11. Reinstall
      # ==========================================
      - name: Reinstall dependencies
        working-directory: source/LunarProxy-main/app
        run: |
          npm install --legacy-peer-deps


      # ==========================================
      # 12. Create missing icon assets
      # ==========================================
      - name: Create missing app icons
        working-directory: source/LunarProxy-main/app
        run: |
          mkdir -p assets

          sudo apt-get update
          sudo apt-get install -y imagemagick

          convert -size 512x512 xc:"#232323" assets/icon.png
          convert -size 512x512 xc:"#232323" assets/adaptive-icon.png

          echo "===== ICON FILES ====="
          ls -lh assets/icon.png
          ls -lh assets/adaptive-icon.png


      # ==========================================
      # 13. Expo Doctor
      # ==========================================
      - name: Expo Doctor
        working-directory: source/LunarProxy-main/app
        continue-on-error: true
        run: |
          npx expo-doctor


      # ==========================================
      # 14. Check Expo
      # ==========================================
      - name: Check Expo
        working-directory: source/LunarProxy-main/app
        run: |
          echo "===== EXPO ====="
          npx expo --version

          echo ""
          echo "===== PACKAGES ====="

          npm list \
            expo \
            react \
            react-native \
            react-native-reanimated \
            react-native-worklets \
            --depth=0 || true


      # ==========================================
      # 15. Expo Prebuild
      # ==========================================
      - name: Create Android project
        working-directory: source/LunarProxy-main/app
        run: |
          npx expo prebuild \
            --platform android \
            --clean


      # ==========================================
      # 16. Prepare Gradle
      # ==========================================
      - name: Prepare Gradle
        working-directory: source/LunarProxy-main/app/android
        run: |
          chmod +x gradlew


      # ==========================================
      # 17. Build APK
      # ==========================================
      - name: Build APK
        working-directory: source/LunarProxy-main/app/android
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon


      # ==========================================
      # 18. Find APK
      # ==========================================
      - name: Find APK
        run: |
          echo "========================================"
          echo "LUNARPROXY APK"
          echo "========================================"

          find source/LunarProxy-main/app/android \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "===== APK SIZE ====="

          find source/LunarProxy-main/app/android \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # ==========================================
      # 19. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LunarProxy-debug
          path: |
            source/LunarProxy-main/app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
