name: Build LunarProxy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          echo "===== ANDROID SDK ====="
          sdkmanager --version

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "===== INSTALLED SDK ====="
          sdkmanager --list_installed | head -100

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip imagemagick

      - name: Extract LunarProxy
        run: |
          mkdir -p source

          unzip -o LunarProxy-main.zip -d source

          echo "===== SOURCE DIRECTORY ====="
          find source -maxdepth 3 -type f | head -150

      - name: Check project
        working-directory: source/LunarProxy-main/app
        run: |
          echo "===== APP DIRECTORY ====="
          ls -la

          echo ""
          echo "===== PACKAGE.JSON ====="
          cat package.json

      - name: Prepare Expo dependencies
        working-directory: source/LunarProxy-main/app
        run: |
          echo "===== INITIAL NPM INSTALL ====="
          npm install --legacy-peer-deps

          echo ""
          echo "===== REMOVE DIRECT EXPO MODULES ====="
          npm pkg delete dependencies.expo-modules-core

          echo ""
          echo "===== INSTALL EXPO PACKAGES ====="

          npx expo install \
            expo-build-properties \
            expo-font \
            expo-localization \
            expo-notifications \
            expo-secure-store \
            expo-splash-screen \
            expo-tracking-transparency \
            expo-web-browser \
            react-native-worklets

          echo ""
          echo "===== FIX EXPO DEPENDENCIES ====="

          npx expo install --fix

          echo ""
          echo "===== INSTALL REACT NATIVE ====="

          npx expo install react-native@0.81.5

          echo ""
          echo "===== INSTALL WORKLETS ====="

          npx expo install react-native-worklets

          echo ""
          echo "===== FINAL PACKAGE.JSON ====="
          cat package.json

      - name: Disable Firebase Google Services
        working-directory: source/LunarProxy-main/app
        run: |
          if [ -f app.json ]; then

            echo "===== BACKUP APP.JSON ====="
            cp app.json app.json.backup

            node -e '
            const fs = require("fs");

            const path = "app.json";
            const data = JSON.parse(fs.readFileSync(path, "utf8"));

            let expo;

            if (
              data.expo &&
              typeof data.expo === "object" &&
              !Array.isArray(data.expo)
            ) {
              expo = data.expo;
            } else {
              expo = data;
            }

            if (
              expo.android &&
              typeof expo.android === "object"
            ) {
              delete expo.android.googleServicesFile;
            }

            if (Array.isArray(expo.plugins)) {
              expo.plugins = expo.plugins.filter((plugin) => {
                const name = Array.isArray(plugin)
                  ? plugin[0]
                  : plugin;

                return (
                  name !== "@react-native-firebase/app" &&
                  name !== "@react-native-firebase/crashlytics"
                );
              });
            }

            fs.writeFileSync(
              path,
              JSON.stringify({ expo }, null, 2) + "\n"
            );

            console.log("Expo configuration updated.");
            '

            echo ""
            echo "===== FINAL APP.JSON ====="
            cat app.json

          else
            echo "app.json not found."
          fi

      - name: Create missing app icons
        working-directory: source/LunarProxy-main/app
        run: |
          mkdir -p assets

          if [ ! -f assets/icon.png ]; then
            echo "Creating icon.png"
            convert \
              -size 512x512 \
              xc:"#232323" \
              assets/icon.png
          fi

          if [ ! -f assets/adaptive-icon.png ]; then
            echo "Creating adaptive-icon.png"
            convert \
              -size 512x512 \
              xc:"#232323" \
              assets/adaptive-icon.png
          fi

          echo ""
          echo "===== ICON FILES ====="
          ls -lh assets/

      - name: Expo Doctor
        working-directory: source/LunarProxy-main/app
        run: |
          echo "===== EXPO DOCTOR ====="
          npx expo-doctor || true

      - name: Expo Config Check
        working-directory: source/LunarProxy-main/app
        run: |
          echo "===== EXPO CONFIG ====="
          npx expo config --type public || true

      - name: Expo Prebuild
        working-directory: source/LunarProxy-main/app
        run: |
          echo "===== EXPO PREBUILD ====="

          npx expo prebuild \
            --platform android \
            --clean

      - name: Check Android project
        working-directory: source/LunarProxy-main/app/android
        run: |
          echo "===== ANDROID PROJECT ====="
          ls -la

          echo ""
          echo "===== GRADLE VERSION ====="
          ./gradlew --version

      - name: Build Debug APK
        working-directory: source/LunarProxy-main/app/android
        run: |
          chmod +x gradlew

          echo "========================================"
          echo "        BUILDING LUNARPROXY APK"
          echo "========================================"

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all \
            2>&1 | tee gradle-build.log

          status=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "        GRADLE ERROR SUMMARY"
          echo "========================================"

          grep -n \
            -A25 \
            -B8 \
            -E \
            "FAILURE:|What went wrong:|Caused by:|Execution failed for task|A problem occurred" \
            gradle-build.log || true

          echo ""
          echo "========================================"
          echo "        BUILD RESULT"
          echo "========================================"

          if [ "$status" -eq 0 ]; then
            echo "BUILD SUCCESS"
          else
            echo "BUILD FAILED"
          fi

          exit "$status"

      - name: Find APK
        if: success()
        run: |
          echo "========================================"
          echo "              APK FILES"
          echo "========================================"

          find source/LunarProxy-main/app/android \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LunarProxy-debug
          path: source/LunarProxy-main/app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LunarProxy-gradle-log
          path: source/LunarProxy-main/app/android/gradle-build.log
          if-no-files-found: ignore
