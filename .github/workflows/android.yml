name: Build LunarProxy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip imagemagick

      - name: Extract LunarProxy
        run: |
          mkdir -p source
          unzip -o LunarProxy-main.zip -d source

          echo "===== SOURCE ====="
          find source -maxdepth 3 -type f | head -100

      - name: Check app folder
        working-directory: source/LunarProxy-main/app
        run: |
          echo "===== APP FILES ====="
          ls -la
          echo ""
          echo "===== PACKAGE.JSON ====="
          cat package.json

      - name: Prepare Expo dependencies
        working-directory: source/LunarProxy-main/app
        run: |
          npm install

          echo "Removing problematic direct Expo module..."
          npm pkg delete dependencies.expo-modules-core

          echo "Installing Expo SDK compatible packages..."
          npx expo install \
            expo-build-properties \
            expo-font \
            expo-localization \
            expo-notifications \
            expo-secure-store \
            expo-splash-screen \
            expo-tracking-transparency \
            expo-web-browser \
            react-native-worklets

          echo "Fixing Expo dependencies..."
          npx expo install --fix

          echo "Installing required React Native version..."
          npx expo install react-native@0.81.5

          echo "Installing Worklets..."
          npx expo install react-native-worklets

      - name: Disable Firebase Google Services
        working-directory: source/LunarProxy-main/app
        run: |
          if [ -f app.json ]; then
            cp app.json app.json.backup

            node -e '
            const fs = require("fs");
            const p = "app.json";
            const d = JSON.parse(fs.readFileSync(p, "utf8"));

            const expo =
              d.expo &&
              typeof d.expo === "object" &&
              !Array.isArray(d.expo)
                ? d.expo
                : d;

            if (expo.android) {
              delete expo.android.googleServicesFile;
            }

            if (Array.isArray(expo.plugins)) {
              expo.plugins = expo.plugins.filter((plugin) => {
                const name = Array.isArray(plugin) ? plugin[0] : plugin;
                return (
                  name !== "@react-native-firebase/app" &&
                  name !== "@react-native-firebase/crashlytics"
                );
              });
            }

            const output = { expo };
            fs.writeFileSync(p, JSON.stringify(output, null, 2) + "\n");
            '

            echo "===== APP.JSON AFTER FIREBASE FIX ====="
            cat app.json
          fi

      - name: Create missing app icons
        working-directory: source/LunarProxy-main/app
        run: |
          mkdir -p assets

          if [ ! -f assets/icon.png ]; then
            convert -size 512x512 xc:"#232323" assets/icon.png
          fi

          if [ ! -f assets/adaptive-icon.png ]; then
            convert -size 512x512 xc:"#232323" assets/adaptive-icon.png
          fi

          echo "===== ICONS ====="
          ls -lh assets/

      - name: Expo Doctor
        working-directory: source/LunarProxy-main/app
        run: |
          npx expo-doctor || true

      - name: Expo Config Check
        working-directory: source/LunarProxy-main/app
        run: |
          npx expo config --type public || true

      - name: Expo Prebuild
        working-directory: source/LunarProxy-main/app
        run: |
          npx expo prebuild --platform android --clean

      - name: Build Debug APK
        working-directory: source/LunarProxy-main/app/android
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            2>&1 | tee gradle-build.log

          status=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "       GRADLE ERROR SUMMARY"
          echo "========================================"

          grep -n -A20 -B5 \
            -E "FAILURE:|What went wrong:|Caused by:|Execution failed for task|A problem occurred" \
            gradle-build.log || true

          exit $status

      - name: Find APK
        if: success()
        run: |
          echo "===== APK FILES ====="
          find source/LunarProxy-main/app/android \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LunarProxy-debug
          path: source/LunarProxy-main/app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LunarProxy-gradle-log
          path: source/LunarProxy-main/app/android/gradle-build.log
          if-no-files-found: ignore
