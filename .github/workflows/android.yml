
name: Build LunarProxy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: LunarProxy-main/app/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Extract source
        run: |
          unzip -o LunarProxy-main.zip -d source
          find source -maxdepth 3 -type f | head -100

      - name: Install dependencies
        working-directory: source/LunarProxy-main/app
        run: npm install

      - name: Check project
        working-directory: source/LunarProxy-main/app
        run: npx expo --version

      - name: Prebuild Android
        working-directory: source/LunarProxy-main/app
        run: npx expo prebuild --platform android

      - name: Build APK
        working-directory: source/LunarProxy-main/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LunarProxy-debug
          path: source/LunarProxy-main/app/android/app/build/outputs/apk/debug/*.apk
