name: Build LunarProxy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # Java
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================
      # Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # =========================
      # Go
      # =========================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"


      # =========================
      # Extract ZIP
      # =========================
      - name: Extract LunarProxy
        run: |
          mkdir -p source
          unzip -o LunarProxy-main.zip -d source

          echo "===== PROJECT ====="
          find source/LunarProxy-main -maxdepth 3 -type f | sort | head -200


      # =========================
      # Prepare package.json
      # =========================
      - name: Prepare Expo project
        working-directory: source/LunarProxy-main/app
        run: |
          echo "===== ORIGINAL PACKAGE ====="
          cat package.json

          # Keep Expo SDK 54
          npm pkg set dependencies.expo="~54.0.0"

          # SDK 54 uses React 19.1
          npm pkg set dependencies.react="19.1.0"

          # SDK 54 uses React Native 0.81
          npm pkg set dependencies.react-native="0.81.4"

          # Remove invalid Expo package versions.
          # Expo CLI will install compatible versions later.
          npm pkg delete dependencies.expo-build-properties
          npm pkg delete dependencies.expo-font
          npm pkg delete dependencies.expo-localization
          npm pkg delete dependencies.expo-modules-core
          npm pkg delete dependencies.expo-notifications
          npm pkg delete dependencies.expo-secure-store
          npm pkg delete dependencies.expo-splash-screen
          npm pkg delete dependencies.expo-tracking-transparency
          npm pkg delete dependencies.expo-web-browser

          echo ""
          echo "===== PREPARED PACKAGE ====="
          cat package.json


      # =========================
      # Install base dependencies
      # =========================
      - name: Install base dependencies
        working-directory: source/LunarProxy-main/app
        run: |
          npm install --legacy-peer-deps


      # =========================
      # Install Expo packages
      # =========================
      - name: Install Expo SDK 54 packages
        working-directory: source/LunarProxy-main/app
        run: |
          npx expo install \
            expo-build-properties \
            expo-font \
            expo-localization \
            expo-notifications \
            expo-secure-store \
            expo-splash-screen \
            expo-tracking-transparency \
            expo-web-browser


      # =========================
      # Install Expo modules core
      # =========================
      - name: Install Expo modules core
        working-directory: source/LunarProxy-main/app
        run: |
          npx expo install expo-modules-core


      # =========================
      # Check Expo
      # =========================
      - name: Check Expo
        working-directory: source/LunarProxy-main/app
        run: |
          echo "===== EXPO VERSION ====="
          npx expo --version

          echo ""
          echo "===== EXPO DOCTOR ====="
          npx expo-doctor


      # =========================
      # Generate Android
      # =========================
      - name: Create Android project
        working-directory: source/LunarProxy-main/app
        run: |
          npx expo prebuild \
            --platform android \
            --clean


      # =========================
      # Prepare Gradle
      # =========================
      - name: Prepare Gradle
        working-directory: source/LunarProxy-main/app/android
        run: |
          chmod +x gradlew


      # =========================
      # Build APK
      # =========================
      - name: Build APK
        working-directory: source/LunarProxy-main/app/android
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon


      # =========================
      # Find APK
      # =========================
      - name: Find APK
        run: |
          echo "======================================"
          echo "LUNARPROXY APK"
          echo "======================================"

          find source/LunarProxy-main/app/android \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "===== APK SIZE ====="

          find source/LunarProxy-main/app/android \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # =========================
      # Upload APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LunarProxy-debug
          path: |
            source/LunarProxy-main/app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
